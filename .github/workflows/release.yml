name: Release firmware

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install platformio==6.1.18 esptool==4.8.1
      - name: Build ESP32 firmware
        run: pio run -e wemos_d1_mini32
      - name: Package factory and OTA images
        run: |
          mkdir -p release
          cp .pio/build/wemos_d1_mini32/firmware.bin release/archer-clock-ota.bin
          python -m esptool --chip esp32 merge_bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            -o release/archer-clock-factory.bin \
            0x1000 .pio/build/wemos_d1_mini32/bootloader.bin \
            0x8000 .pio/build/wemos_d1_mini32/partitions.bin \
            0xe000 "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            0x10000 .pio/build/wemos_d1_mini32/firmware.bin
          cd release
          sha256sum *.bin > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.bin release/SHA256SUMS --clobber
          else
            FLAGS=()
            if [[ "$RELEASE_TAG" == *-* ]]; then FLAGS+=(--prerelease); fi
            gh release create "$RELEASE_TAG" release/*.bin release/SHA256SUMS \
              --verify-tag --title "$RELEASE_TAG" --generate-notes "${FLAGS[@]}"
          fi

  installer:
    needs: release
    # Releases created with GITHUB_TOKEN do not trigger another release event.
    uses: ./.github/workflows/installer.yml
