name: Deploy firmware installer

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [published, edited, deleted]
  push:
    branches: ['**']
    paths:
      - 'web/**'
      - 'tools/build_installer.py'
      - '.github/workflows/installer.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Reusable calls retain the tag-push event from the release workflow.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test release packaging
        run: python -m unittest discover -s tools/tests -v
      - name: Prepare installer from GitHub Releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          cp -R web/flash/. site/
          python tools/build_installer.py --site site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy installer
        id: deployment
        uses: actions/deploy-pages@v4
